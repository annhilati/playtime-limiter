# THE PLUGIN DOES NOT EXPLICITELY REPORT FAULTY CONFIGURATION. IF SOMETHING ISN'T WORKING, SEEK SUPPORT.

default-group: example
# The name of the group that is used for all players with no group assigned by a permission node. It should be defined in the groups section.

groups:
# Groups are used to apply certain behaviors to specific players.
# Groups are assigned by a permission node 'limiter.group.{groupname}' whereby {groupname} refers to a key in this groups section.

  example:
  # This a group. Its name can be chosen freely.
    start-timer: 3600
    # The number of seconds new joining players of the group start with.
    start-mode: ticking
    # The timer mode new joining players of the group start with. One of "ticking", "paused" and "bypass"
    rules:
    # Rules are modificators for the players timers that have a trigger (and conditions) and one or multiple actions.

      rule:
      # This is a rule. Its name can be chosen freely.
        when:
          time: 0 1 * * *
          # A cronjob expression (see https://crontab.cronhub.io/)
        # restrict: false # 
        action:
          changetimer: 3600
          # Number of seconds to add to the players timer
        # settimer: 3600
          # Number of seconds to set the players timer to
        # execute: say It's 3 o' clock
          # Doesn't support placeholders 

update-cycle: 30
# The number of seconds between two rule checks (used for other stuff too).


# when -> condition/trigger
# condition & action: dict -> list